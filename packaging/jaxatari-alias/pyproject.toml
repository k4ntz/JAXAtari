[project]
name = "jaxatari"
version = "0.2.0"
description = "Temporary alias for JAXtari. Prefer installing jaxtari and using import jaxtari — this shim will be removed soon."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["JAXtari==0.2.0"]

[project.urls]
Homepage = "https://github.com/k4ntz/JAXAtari"
"Main package" = "https://pypi.org/project/JAXtari/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.sdist]
include = ["/README.md", "/pyproject.toml"]
exclude = ["**/__pycache__"]
