name: Publish release to PyPI

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish jaxtari packages
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/jaxtari/
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out release
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify release tag matches package versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION=$(python -c \
            "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          ALIAS_VERSION=$(python -c \
            "import tomllib; print(tomllib.load(open('packaging/jaxatari-alias/pyproject.toml', 'rb'))['project']['version'])")
          ALIAS_DEPENDENCY=$(python -c \
            "import tomllib; print(tomllib.load(open('packaging/jaxatari-alias/pyproject.toml', 'rb'))['project']['dependencies'][0])")
          EXPECTED_TAG="v${PACKAGE_VERSION}"

          if [[ "${RELEASE_TAG}" != "${EXPECTED_TAG}" ]]; then
            echo "Release tag ${RELEASE_TAG} does not match package version ${PACKAGE_VERSION}."
            echo "Expected tag: ${EXPECTED_TAG}"
            exit 1
          fi

          if [[ "${ALIAS_VERSION}" != "${PACKAGE_VERSION}" ]]; then
            echo "Alias version ${ALIAS_VERSION} does not match package version ${PACKAGE_VERSION}."
            exit 1
          fi

          if [[ "${ALIAS_DEPENDENCY}" != "JAXtari==${PACKAGE_VERSION}" ]]; then
            echo "Alias dependency ${ALIAS_DEPENDENCY} does not target JAXtari ${PACKAGE_VERSION}."
            exit 1
          fi

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build distributions
        run: |
          python -m build --outdir dist .
          python -m build --outdir dist packaging/jaxatari-alias

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
