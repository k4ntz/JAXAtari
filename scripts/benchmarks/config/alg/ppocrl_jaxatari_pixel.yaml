EXP_NAME: ppoewc
TRACK: True
CAPTURE_VIDEO: False
VIDEO_AT_END: True  # True: capture videos only at the end of training on a task

EVAL_DURING_TRAIN: False
EVAL_EVERY: 200
EVAL_EPISODES: 10

PIXEL_BASED: True
NATIVE_DOWNSCALING: True
PIXEL_RESIZE_SHAPE: [84, 84]
SMOOTH_IMAGE: False

FRAME_STACK: 4

SAVE_MODEL: False
UPLOAD_MODEL: False
HF_ENTITY: ""

TASKS: [pong, pong, pong] # replaces ENV_ID
TIMESTEPS_PER_TASK: 100000  # replaces TOTAL_TIMESTEPS

TRAIN_MODS: # mods applied during training, for each environment
  - [lazy_enemy]
  - [shift_enemy]
  - [shift_player]
EVAL_MODS:  # mods applied during evaluation, for each environment
  - [lazy_enemy]
  - [shift_enemy]
  - [shift_player]

CL_METHOD: packnet  # ewc, agem, packnet

EWC_DECAY: 0.9  # Decay for Online EWC
EWC_LAMBDA: 500000.0  # Weight for EWC penalty

PRUNE_ITERATION_FRAC: 0.5  # Percentage of training at which the PackNet pruning is performed

LEARNING_RATE: 0.00025
NUM_ENVS: 8
NUM_STEPS: 128
ANNEAL_LR: True
GAMMA: 0.99
GAE_LAMBDA: 0.95
NUM_MINIBATCHES: 4
UPDATE_EPOCHS: 4
NORM_ADV: True
CLIP_COEF: 0.1
CLIP_VLOSS: False
ENT_COEF: 0.01
VF_COEF: 0.5
MAX_GRAD_NORM: 0.5
TARGET_KL: null
